[package]
name = "lumenply-cli"
description = "Headless command-line front end: composite, paint, benchmark"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "lumenply"
path = "src/main.rs"

[features]
# `lumenply ai`: local AI selection and masking, which links ONNX Runtime
# (ADR 0028). Build with --no-default-features to leave it out.
default = ["ai"]
ai = ["dep:lumenply-ai", "dep:image"]

[dependencies]
lumenply-tiles.workspace = true
lumenply-doc.workspace = true
lumenply-render.workspace = true
lumenply-graph.workspace = true
lumenply-io.workspace = true
lumenply-core.workspace = true
lumenply-ai = { workspace = true, optional = true }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
# `lumenply ai select` writes greyscale masks.
image = { workspace = true, optional = true }

[dev-dependencies]
image.workspace = true

