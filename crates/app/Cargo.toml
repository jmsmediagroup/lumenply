[package]
name = "lumenply-app"
description = "Desktop editor shell (egui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "lumenply-app"
path = "src/main.rs"

[features]
# Local AI selection and masking (ADR 0028), which links ONNX Runtime.
# Build with --no-default-features to leave it out (the AI features then
# say this build doesn't include them).
default = ["ai"]
ai = ["dep:lumenply-ai"]
# The user-session test harness (src/uitest, docs/testing/harness.md):
# drives the real UI headlessly with input events, renders it offscreen
# and records each session as a video. `lumenply-app --uitest`.
uitest = ["dep:egui-wgpu", "dep:wgpu", "dep:pollster", "dep:fontdue"]

[dependencies]
lumenply-tiles.workspace = true
lumenply-doc.workspace = true
lumenply-render.workspace = true
lumenply-io.workspace = true
lumenply-core.workspace = true
lumenply-graph.workspace = true
lumenply-ai = { workspace = true, optional = true }
rayon.workspace = true
arboard = { version = "3", default-features = false, features = ["image-data"] }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "accesskit"] }
# Native file dialogs. Default features on purpose: on Linux/BSD that is the
# XDG desktop portal over D-Bus (no GTK needed to build), falling back to
# `zenity` at run time when no portal answers. Windows and macOS use the
# system dialogs directly.
rfd = "0.15"
serde.workspace = true
serde_json.workspace = true
image.workspace = true
# uitest only: offscreen rendering of the UI and the video captions.
egui-wgpu = { version = "0.29", default-features = false, optional = true }
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
fontdue = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "block2"] }
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSURL", "NSString"] }

[dev-dependencies]
image-webp = "0.2"
