name: CI

# Every push: formatting, lints and the tests on Linux. Pull requests and
# manual runs also test on Windows and macOS. The downloads are built by
# release.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl-dev libx11-dev libwayland-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl-dev libx11-dev libwayland-dev
      - run: cargo test --release --workspace

  bench-gate:
    name: performance gate
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p lumenply-cli
      # Budget is deliberately loose; tighten it once the GPU path is the default.
      - run: |
          out=$(./target/release/lumenply bench --size 2048 --layers 10 --runs 3)
          echo "$out"
          best=$(echo "$out" | sed -n 's/^best: \([0-9.]*\) ms.*/\1/p')
          awk -v b="$best" 'BEGIN { if (b == "" || b > 2000) { print "composite too slow: " b " ms"; exit 1 } }'
