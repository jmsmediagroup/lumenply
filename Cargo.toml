[workspace]
resolver = "3"
members = [
    "crates/tiles",
    "crates/doc",
    "crates/render",
    "crates/graph",
    "crates/io",
    "crates/core",
    "crates/cli",
    "crates/app",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/CHANGE-ME/nge"
authors = ["NGE contributors"]

[workspace.dependencies]
lumenply-tiles = { path = "crates/tiles" }
lumenply-doc = { path = "crates/doc" }
lumenply-render = { path = "crates/render" }
lumenply-graph = { path = "crates/graph" }
lumenply-io = { path = "crates/io" }
lumenply-core = { path = "crates/core" }

rayon = "1.10"
thiserror = "1.0"
anyhow = "1.0"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "tiff", "webp", "gif", "bmp", "ico", "tga", "pnm", "qoi"] }
exr = "1.72"
qcms = "0.3"
fontdb = "0.16"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
flate2 = "1"
png = "0.17"
fontdue = "0.9"
quick-xml = "0.36"
wgpu = "22"
pollster = "0.3"
blake3 = "1.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

# Tests and benches that push pixels are unbearably slow unoptimised.
[profile.dev.package."*"]
opt-level = 2
